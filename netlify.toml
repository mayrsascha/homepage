[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"

# Netlify's edge keeps every response until the next deploy (deploys purge
# it automatically). Without this, the HTML's browser policy (max-age=0,
# must-revalidate) also applied at the edge: every visit went back to the
# origin ("fwd=stale"), adding 100-250 ms of TTFB. Browsers still revalidate.
[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=31536000"

# Security headers. Content-Security-Policy (with per-build hashes of the
# inline scripts/styles) is generated into build/_headers by vite.config.ts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"
    # Two years, all subdomains, eligible for the browsers' preload list
    # (hstspreload.org): browsers never try plain HTTP, not even on the first
    # visit. Every future subdomain must serve HTTPS.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Content-hashed build assets (the photos): a new file means a new URL, so
# cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed static files (icons, the WebP placeholder fallback) can't change
# URL when their content changes: 30 days, revalidated in the background.
# HTML keeps Netlify's default (always revalidated) so deploys show up
# immediately.
[[headers]]
  for = "/profile-lqip.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"

[[headers]]
  for = "/sascha-mayr.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"

# /index.html: Netlify's own redirect skips the custom headers above (its
# HSTS lacks includeSubDomains); this one carries them. (A rule for /index
# has no effect, and one for /sitemap.xml/ loops: rules ignore a trailing
# slash.) The 404 page answers 404 at its own URLs too.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/404.html"
  to = "/404.html"
  status = 404
  force = true
