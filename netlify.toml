[build]
  command = "pnpm run build"
  publish = "build"

# Node: Netlify reads the version from .nvmrc.

# Edge caching needs no config: Netlify caches static deploy files at the
# edge for a year and purges them on every deploy (docs: "Caching overview").
# Cache hits vary because requests land on different cache instances.

# Headers are all generated into build/_headers (vite.config.ts): the
# security headers, the CSP with per-build hashes, and caching (hashed
# photos immutable, the unhashed public/ files 30 days). HTML keeps
# Netlify's default (always revalidated) so deploys show up immediately.

# /index.html: Netlify's own redirect skips our custom headers (its
# HSTS lacks includeSubDomains); this one carries them. (A rule for /index
# has no effect, and one for /sitemap.xml/ loops: rules ignore a trailing
# slash.) The 404 page answers 404 at its own URLs too.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/404.html"
  to = "/404.html"
  status = 404
  force = true
