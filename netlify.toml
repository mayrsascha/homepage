[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Photos and icons aren't content-hashed, so no "immutable": cache for a week,
# then revalidate in the background. HTML keeps Netlify's default (always
# revalidated) so deploys show up immediately.
[[headers]]
  for = "/profile*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
