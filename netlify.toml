[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Netlify's edge keeps every response until the next deploy (deploys purge
# it automatically). Without this, the HTML's browser policy (max-age=0,
# must-revalidate) also applied at the edge: every visit went back to the
# origin ("fwd=stale"), adding 100-250 ms of TTFB. Browsers still revalidate.
[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=31536000"

# Content-hashed build assets (the photos): a new file means a new URL, so
# cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed static files (icons, the WebP placeholder fallback) can't change
# URL when their content changes: 30 days, revalidated in the background.
# HTML keeps Netlify's default (always revalidated) so deploys show up
# immediately.
[[headers]]
  for = "/profile-lqip.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"
