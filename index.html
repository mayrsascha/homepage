<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />

    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">

      name="description"
      content="Software Engineer → Data Accuracy & Visualization. Building systems where data integrity is the product: Ruby Money contributor, Aquascala water quality intelligence, Wayfinder Health data platforms."
    />
    <title>Sascha Mayr | Software Engineer → Data Accuracy & Visualization</title>
    <link rel="preload" as="image" href="/profile.webp" type="image/webp" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/highlightjs/cdn-release@10.1.1/build/styles/solarized-light.min.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/highlightjs/cdn-release@10.1.1/build/styles/tomorrow-night.min.css" media="(prefers-color-scheme: dark)" />
    <style>
      html,body,#root{height:100%;font-family:monospace;margin:0}
      *,*::before,*::after{box-sizing:border-box}
      .App{height:100%;width:100%;display:flex;flex-direction:column}
      .content{flex:1 0 auto;padding:1em 1em 0;background-color:#fdf6e3}
      .App.darkmode .content{background-color:#1d1f21}
      .profile img{width:100%;max-width:500px;object-fit:cover}
      .Footer{width:100%;text-align:center;display:flex;justify-content:space-around;align-items:center;color:#657b83;background-color:#fdf6e3;padding:0 10px}
      .App.darkmode .Footer{color:#c5c8c6;background-color:#1d1f21}
      @media (prefers-color-scheme: dark){
        .content{background-color:#1d1f21}
        .Footer{color:#c5c8c6;background-color:#1d1f21}
      }
      @media (min-width: 720px){
        .content{display:flex;align-items:center}
        .profile{width:50%;display:inline-flex;justify-content:center;align-items:flex-start}
        .Footer{justify-content:center;padding:0}
        .Footer .button,.Footer .github-link img{width:30px;font-size:2.5em}
      }
    </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Sascha Mayr",
      "url": "https://saschamayr.dev",
      "sameAs": [
        "https://github.com/mayrsascha",
        "https://stackoverflow.com/users/1864315/sascha-mayr",
        "https://app.usebraintrust.com/talent/7111/",
        "https://www.instagram.com/sascha.lives"
      ],
      "knowsAbout": [
        "Data Engineering",
        "Data Visualization",
        "Full-Stack Development",
        "Open Data",
        "Ruby",
        "JavaScript",
        "React",
        "Node.js",
        "PostgreSQL",
        "Geospatial Data",
        "Financial Data Standards"
      ],
      "description": "Software Engineer specializing in data accuracy, visualization, and open data standards. Contributor to Ruby Money. Founder of Aquascala and Shumi."
    }
    </script>
    <!-- Google tag (gtag.js) - deferred -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H4E5L0QS0V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-H4E5L0QS0V');

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="App">
        <main class="content">
          <div class="Hero">
            <h1># Hello `visitorName`</h1>
            <p><strong>Sascha Mayr</strong> — Software Engineer → Data Accuracy & Visualization</p>
            <p>Drinking too much coffee <span role="img" aria-label="coffee icon">☕️</span>.</p>
          </div>
          <div class="profile">
            <picture>
              <source srcSet="/profile.webp" type="image/webp" />
              <img src="/profile.png" alt="Profile" />
            </picture>
          </div>
        </main>
        <footer class="Footer">
          <div>
            <p>Built with Netlify, Vite and React</p>
            <p>© 2025 Sascha Mayr. All rights reserved.</p>
          </div>
          <button class="button">🌙</button>
          <a href="https://github.com/mayrsascha/homepage" target="_blank" rel="noopener noreferrer" class="github-link">
            <img src="/github.png" alt="github" />
          </a>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
