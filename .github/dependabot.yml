# Dependency updates for the build tooling (vite, typescript, lhci), monthly and
# grouped into a single PR. The site has no runtime dependencies.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      tooling:
        patterns: ["*"]
  # The CI workflow's actions are pinned by commit SHA; this keeps them
  # current (the version comment next to each SHA is updated too).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
