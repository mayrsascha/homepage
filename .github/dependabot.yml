# Dependency updates for the build tooling (vite, typescript, biome), monthly and
# grouped into a single PR. The site has no runtime dependencies.
# Releases younger than 7 days are skipped (cooldown): a hijacked package
# is usually caught and pulled within days.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      tooling:
        patterns: ["*"]
  # The CI workflow's actions are pinned by commit SHA; this keeps them
  # current (the version comment next to each SHA is updated too).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
