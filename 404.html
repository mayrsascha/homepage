<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 | Sascha Mayr</title>
    <link rel="icon" href="/favicon.svg">
    <script>
      // Same theme choice as the homepage (toggle remembered in localStorage,
      // else the OS preference). Without JS the media query below applies.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('darkMode'); } catch (e) {}
        if (stored) document.documentElement.className = stored === 'true' ? 'js-dark' : 'js-light';
      })();
    </script>
    <style>
      :root{--bg:#fdf6e3;--fg:#5f747c;--hl-section:#2076b3;--hl-string:#217e77;--hl-link:#c44815;--hl-bullet:#c44815}
      @media screen{html.js-dark{color-scheme:dark;--bg:#1d1f21;--fg:#c5c8c6;--hl-section:#81a2be;--hl-string:#b5bd68;--hl-link:#de935f;--hl-bullet:#b5bd68}}
      @media screen and (prefers-color-scheme: dark){html:not(.js-light){color-scheme:dark;--bg:#1d1f21;--fg:#c5c8c6;--hl-section:#81a2be;--hl-string:#b5bd68;--hl-link:#de935f;--hl-bullet:#b5bd68}}
      html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}body{font-family:monospace}
      body{display:flex;align-items:center;justify-content:center;padding:1em;box-sizing:border-box}
      .md{font-size:.8125rem;line-height:1.15;white-space:pre-wrap}
      h1{margin:0;font-size:1.5em;color:var(--hl-section)}
      a{color:inherit;text-decoration:none}
      .s{color:var(--hl-string)}.l{color:var(--hl-link)}.b{color:var(--hl-bullet)}
    </style>
  </head>
  <body>
    <main class="md"><h1 aria-label="404, page not found"># 404</h1>
This page doesn't exist. The data on the homepage is accurate, though.

<span class="b" aria-hidden="true">-</span> <a href="/" aria-label="Back to the homepage">[<span class="s">Back to the homepage</span>](<span class="l">/</span>)</a></main>
  </body>
</html>
