    <script>
      // Same theme choice as the homepage (toggle remembered in localStorage,
      // else the OS preference). Without JS the media query below applies.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('darkMode'); } catch (e) {}
        if (stored) document.documentElement.className = stored === 'true' ? 'js-dark' : 'js-light';
      })();
    </script>
    <style>
      :root{--bg:#fdf6e3;--fg:#5f747c;--section:#2076b3;--string:#217e77;--link:#c44815;--bullet:#c44815}
      html.js-dark{--bg:#1d1f21;--fg:#c5c8c6;--section:#81a2be;--string:#b5bd68;--link:#de935f;--bullet:#b5bd68}
      @media (prefers-color-scheme: dark){html:not(.js-light){--bg:#1d1f21;--fg:#c5c8c6;--section:#81a2be;--string:#b5bd68;--link:#de935f;--bullet:#b5bd68}}
      html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:monospace}
      body{display:flex;align-items:center;justify-content:center;padding:1em}
      .md{font-size:13px;line-height:1.15;white-space:pre-wrap}
      h1{margin:0;font-size:1.5em;color:var(--section)}
      a{color:inherit;text-decoration:none}
      .s{color:var(--string)}.l{color:var(--link)}.b{color:var(--bullet)}
    </style>
  </head>
  <body>

<span class="b" aria-hidden="true">-</span> <a href="/" aria-label="Back to the homepage">[<span class="s">Back to the homepage</span>](<span class="l">/</span>)</a></div>
