<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 | Sascha Mayr</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <style>
      :root{--bg:#fdf6e3;--fg:#657b83;--section:#268bd2;--string:#2aa198;--link:#cb4b16;--bullet:#cb4b16}
      @media (prefers-color-scheme: dark){:root{--bg:#1d1f21;--fg:#c5c8c6;--section:#81a2be;--string:#b5bd68;--link:#de935f;--bullet:#b5bd68}}
      html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:monospace}
      body{display:flex;align-items:center;justify-content:center;padding:1em}
      pre{margin:0;font-size:13px;line-height:1.15;white-space:pre-wrap}
      h1{margin:0;font-size:1.5em;color:var(--section)}
      a{color:inherit;text-decoration:none}
      .s{color:var(--string)}.l{color:var(--link)}.b{color:var(--bullet)}
    </style>
  </head>
  <body>
    <pre><h1 aria-label="404, page not found"># 404</h1>
This page doesn't exist. The data on the homepage is accurate, though.

<span class="b" aria-hidden="true">-</span> <a href="/" aria-label="Back to the homepage">[<span class="s">Back to the homepage</span>](<span class="l">/</span>)</a></pre>
  </body>
</html>
